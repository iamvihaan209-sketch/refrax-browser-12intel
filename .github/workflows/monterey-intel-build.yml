name: Monterey Intel compatibility build

on:
  push:
    branches:
      - monterey-intel-port
  pull_request:
    branches:
      - monterey-intel-port
  workflow_dispatch:

concurrency:
  group: monterey-intel-port-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-intel:
    name: Build Monterey-compatible Rift Browser (x86_64)
    runs-on: macos-26-intel
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify Apple toolchain
        run: |
          set -euxo pipefail
          xcrun --find swiftc
          swift --version
          xcrun --sdk macosx --show-sdk-version

      - name: Compile native app for macOS 12 Intel
        run: |
          set -euxo pipefail
          APP="$RUNNER_TEMP/RiftBrowser.app"
          mkdir -p "$APP/Contents/MacOS"
          xcrun swiftc -parse-as-library \
            -target x86_64-apple-macosx12.0 \
            -framework AppKit -framework WebKit \
            MontereyBrowser/Browser.swift \
            -o "$APP/Contents/MacOS/RiftBrowser"
          cp MontereyBrowser/Info.plist "$APP/Contents/Info.plist"
          plutil -lint "$APP/Contents/Info.plist"
          file "$APP/Contents/MacOS/RiftBrowser"
          codesign --force --sign - "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/RiftBrowser-macOS12-Intel.zip"

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: rift-browser-macos12-intel
          path: ${{ runner.temp }}/RiftBrowser-macOS12-Intel.zip
          if-no-files-found: error
