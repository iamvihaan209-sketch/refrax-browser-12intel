name: Monterey Intel compatibility build

on:
  push:
    branches:
      - monterey-intel-port
  pull_request:
    branches:
      - monterey-intel-port
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-intel:
    name: Build Refrax for Intel (diagnostic)
    runs-on: macos-26-intel
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 26.5
        run: |
          XCODE_PATH="/Applications/Xcode_26.5.app/Contents/Developer"
          if [ ! -d "$XCODE_PATH" ]; then
            echo "::error::Xcode 26.5 was not found on this runner."
            ls -1 /Applications | grep -i Xcode || true
            exit 1
          fi
          sudo xcode-select --switch "$XCODE_PATH"
          xcodebuild -version

      - name: List project schemes
        run: xcodebuild -list -project Refrax.xcodeproj

      - name: Attempt Intel build
        run: |
          set -o pipefail
          xcodebuild \
            -project Refrax.xcodeproj \
            -scheme Refrax \
            -destination 'platform=macOS,arch=x86_64' \
            -derivedDataPath "$RUNNER_TEMP/RefraxDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/refrax-intel-build.log"
